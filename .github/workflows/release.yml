on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: Release stable or canary?
        required: true
        type: choice
        options:
          - canary
          - stable
      semverType:
        description: semver type?
        type: choice
        options:
          - patch
          - minor
          - major

name: Release

env:
  SEMVER_TYPE: ${{ github.event.inputs.semverType }}
  RELEASE_TYPE: ${{ github.event.inputs.releaseType }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with:
        version: 8
    - uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm i --frozen-lockfile
    - name: Configure git
      run: |
        git config user.name "dragate"
        git config user.email "spidfair@gmail.com"
    - name: Bump version and tag
      run: node ./scripts/bump-version.js
    - name: Push version commit
      run: |
        git push origin ${GITHUB_REF#refs/heads/}
        git push origin --tags
    - name: Create release
      if: github.event.inputs.releaseType == 'stable'
      run: gh release create v${{ steps.bump.outputs.version }} --target ${GITHUB_REF#refs/heads/} --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Create prerelease
      if: github.event.inputs.releaseType == 'canary'
      run: gh release create v${{ steps.bump.outputs.version }} --target ${GITHUB_REF#refs/heads/} --prerelease --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
    # - name: Set publishing config
    #   run: pnpm config set '//registry.npmjs.org/:_authToken' "${NPM_TOKEN}"
    #   env:
    #     NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
